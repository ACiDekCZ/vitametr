# Static PWA served for staging / self-host. Client routes are hash-based, so a
# plain file server suffices; the index fallback is only a safety net.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker must never be cached, or clients get stuck on an old
  # build (the SW is what pulls every new version in).
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Content-addressed, hashed assets can be cached forever.
  location /chunks/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
